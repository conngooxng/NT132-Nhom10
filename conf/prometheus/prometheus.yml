# Prometheus scrapes the nifi-metrics exporter sidecar (NiFi 2.x removed the
# PrometheusReportingTask; the exporter re-serves the authenticated REST
# metrics endpoint on port 9092), hence the service name below.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nifi
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ["nifi-metrics:9092"]
        labels:
          service: nifi-iot-datahub
